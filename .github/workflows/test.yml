name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check custom_components cactus_needle/server.py tests
      - run: python -m compileall -q custom_components cactus_needle
      - run: bash -n macos/cactus-needle.sh
      - run: python -m pytest -q

